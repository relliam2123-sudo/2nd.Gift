<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sixty-Eight Red Roses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene" aria-label="A 3D bouquet of 68 red roses with a pixel girl beside it"></canvas>

<header>
    <h1>Sixty-Eight Red Roses</h1>
    <p id="cap">Swaying with the bouquet</p>
</header>

<nav>
    <button id="musicBtn" type="button" aria-pressed="false">Music off</button>
    <button id="letterBtn" type="button">Open the letter</button>
    <label class="vol">Volume <input id="vol" type="range" min="0" max="100" value="60" aria-label="Music volume"></label>
</nav>
<p class="hint" id="hint">Drag to turn, scroll to zoom, click the bouquet for a petal shower</p>

<div id="intro" class="intro">
    <div class="glow"></div>
    <div class="panel l"></div><div class="panel r"></div>
    <div class="tie l"></div><div class="tie r"></div>
    <div class="valance"></div>
    <div class="stars"></div><div class="stars two"></div>
    <div class="burst"></div>
    <div class="card">
        <div class="plate">
            <span class="orn" aria-hidden="true">✦ ✦ ✦</span>
            <h2>Sixty-Eight Red Roses</h2>
            <p>A bouquet made for you. Turn your sound on.</p>
            <button id="enterBtn" type="button">Open the curtain</button>
        </div>
    </div>
</div>
<script>

    (() => {
        const intro = document.getElementById('intro'), FOLDS = 20;
        intro.querySelectorAll('.panel').forEach(panel => {
            for (let k = 0; k < FOLDS; k++) {
                const s = document.createElement('div');
                s.className = 'strip'; s.style.zIndex = k;
                s.style.setProperty('--k', k); s.style.setProperty('--b', (0.86 + Math.random() * 0.26).toFixed(2));
                s.appendChild(document.createElement('i')); panel.appendChild(s);
            }
        });
        for (let i = 0; i < 36; i++) {
            const s = document.createElement('span'); s.className = 'spark';
            s.style.setProperty('--a', Math.round(Math.random() * 360) + 'deg');
            s.style.setProperty('--d', Math.round(14 + Math.random() * 34) + 'vmin');
            s.style.setProperty('--s', (0.6 + Math.random() * 1.1).toFixed(2));
            s.style.setProperty('--dl', (Math.random() * 0.5).toFixed(2) + 's');
            intro.appendChild(s);
        }
    })();
</script>

<div id="letter" class="letter" hidden>
    <article role="dialog" aria-modal="true" aria-label="Love letter">
        <p id="letterText"></p>
        <button id="closeBtn" type="button">Close the letter</button>
    </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
